<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<!-- ARTIFACT:BEGIN -->
<title>狐火 Foxfire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: full-bleed moonlit garden (WebGL); HUD pinned to safe-area corners; menus are centred ink panels over a live scene. */
:root{
  color-scheme: dark;
  --night:#06111b;
  --panel:rgba(6,17,27,.80);
  --panel-solid:#0a1924;
  --edge:rgba(159,252,255,.20);
  --edge-strong:rgba(159,252,255,.45);
  --moon:#dce9ff;
  --mist:#93abc0;
  --dim:#5f778b;
  --lantern:#ffc46b;
  --foxfire:#9ffcff;
  --foxfire-deep:#2bc8d4;
  --danger:#ff5a4f;
  --warn:#ffd25e;
  --shade:rgba(0,0,0,.55);
  --font-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --font-text:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--moon);font-family:var(--font-text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--foxfire);outline-offset:3px}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.lv-name{font-family:var(--font-brush);font-size:26px;line-height:1;color:var(--moon);text-shadow:0 2px 12px var(--shade)}
.lv-name small{font-family:var(--font-text);font-size:12px;letter-spacing:.2em;color:var(--mist);margin-left:8px}
.pips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:60vw}
.pip{width:13px;height:17px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;border:1.5px solid var(--edge-strong);background:transparent;transition:background .3s,box-shadow .3s,transform .3s}
.pip.on{background:var(--foxfire);border-color:var(--foxfire);box-shadow:0 0 10px var(--foxfire);transform:scale(1.08)}
.lures{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mist);letter-spacing:.08em}
.lure{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--edge-strong)}
.lure.on{background:var(--lantern);border-color:var(--lantern);box-shadow:0 0 8px var(--lantern)}
.hud-tr{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;pointer-events:auto}
.chip-btn{background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;font-size:13px;letter-spacing:.06em;color:var(--mist)}
.chip-btn:hover{color:var(--moon);border-color:var(--edge-strong)}
.status{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.tag{font-size:13px;letter-spacing:.18em;padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);color:var(--mist);transition:all .25s}
.tag.hidden-in-grass{color:var(--foxfire);border-color:var(--edge-strong)}
.tag.lit{color:var(--lantern);border-color:var(--lantern)}
.tag.dash{color:var(--warn);border-color:var(--warn)}
.tag.alert{color:var(--danger);border-color:var(--danger)}
.hint{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));text-align:center;font-size:14px;line-height:1.6;color:var(--moon);background:var(--panel);border:1px solid var(--edge);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .6s}
.hint.show{opacity:1}
.arrow{position:absolute;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--warn);filter:drop-shadow(0 0 6px var(--warn));transform-origin:50% 60%}
.arrow.red{border-bottom-color:var(--danger);filter:drop-shadow(0 0 8px var(--danger))}
.danger-edge{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px var(--danger);opacity:0;transition:opacity .15s}

/* ---------- title card ---------- */
.title-card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s}
.title-card.show{opacity:1}
.title-card .big{font-family:var(--font-brush);font-size:clamp(48px,11vw,104px);color:var(--moon);text-shadow:0 0 30px rgba(159,252,255,.35),0 4px 24px var(--shade);letter-spacing:.08em}
.title-card .sub{margin-top:6px;font-size:15px;letter-spacing:.3em;color:var(--mist);text-align:center;padding-left:16px;padding-right:16px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at center,rgba(6,17,27,.15) 0%,rgba(6,17,27,.62) 70%,rgba(6,17,27,.85) 100%)}
.panel{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:26px 26px 22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 30px 80px var(--shade)}
.logo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.logo h1{margin:0;font-family:var(--font-brush);font-weight:400;font-size:clamp(64px,16vw,96px);line-height:.95;color:var(--moon);text-shadow:0 0 28px rgba(159,252,255,.45)}
.logo .en{font-size:13px;letter-spacing:.5em;color:var(--foxfire)}
.pitch{margin:10px 0 18px;font-size:15px;line-height:1.75;color:var(--moon);max-width:42ch;text-wrap:balance}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;color:var(--mist);margin:0 0 18px}
.keys dt{color:var(--moon);white-space:nowrap}
.keys dd{margin:0;min-width:0}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--edge-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--moon)}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.lvbtn{flex:1 1 84px;min-width:0;background:transparent;border:1px solid var(--edge);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lvbtn .n{font-family:var(--font-brush);font-size:20px;color:var(--moon)}
.lvbtn .s{font-size:11px;letter-spacing:.15em;color:var(--lantern);min-height:14px}
.lvbtn:disabled{opacity:.35;cursor:not-allowed}
.lvbtn.sel{border-color:var(--foxfire);box-shadow:0 0 0 1px var(--foxfire) inset}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--foxfire);color:var(--panel-solid);border:0;border-radius:12px;padding:12px 26px;font-weight:900;font-size:17px;letter-spacing:.3em;box-shadow:0 0 24px rgba(159,252,255,.35)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--moon);border:1px solid var(--edge-strong);box-shadow:none;font-weight:600;letter-spacing:.15em}
.fine{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6}
.result h2{margin:0;font-family:var(--font-brush);font-weight:400;font-size:44px;color:var(--moon)}
.stars{font-size:34px;letter-spacing:.2em;color:var(--lantern);margin:6px 0 10px;text-shadow:0 0 14px rgba(255,196,107,.5)}
.stars .off{color:var(--dim);text-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 20px}
.stat{border:1px solid var(--edge);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--moon);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mist);letter-spacing:.12em}
.caught{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--font-brush);font-size:clamp(56px,13vw,120px);color:var(--danger);text-shadow:0 0 40px rgba(255,90,79,.6),0 6px 30px var(--shade);background:radial-gradient(ellipse at center,rgba(40,0,0,.0),rgba(60,0,0,.55))}

/* ---------- touch ---------- */
.touch{position:fixed;inset:0;pointer-events:none}
.stick{position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;border:1.5px solid var(--edge-strong);background:var(--panel);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--foxfire);opacity:.8;box-shadow:0 0 18px var(--foxfire)}
.tbtns{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.tbtn{width:70px;height:70px;border-radius:50%;border:1.5px solid var(--edge-strong);background:var(--panel);font-size:15px;letter-spacing:.1em;color:var(--moon);touch-action:none}
.tbtn.lure-b{border-color:var(--lantern);color:var(--lantern)}
.tbtn.on{background:var(--foxfire);color:var(--panel-solid)}
@media (min-width:960px) and (min-aspect-ratio:4/3){ #scrStart{justify-content:flex-start;padding-left:max(5vw,env(safe-area-inset-left,0px))} #scrStart .panel{width:min(520px,100%)} #scrStart{background:linear-gradient(90deg,rgba(6,17,27,.72) 0%,rgba(6,17,27,.35) 45%,rgba(6,17,27,0) 70%)} }
.keys .tc{display:none}
@media (pointer:coarse){ .keys .kb{display:none} .keys .tc{display:block} .status{bottom:calc(178px + env(safe-area-inset-bottom,0px))} .hint{font-size:13px} }
@media (max-width:520px){ .hud-tr .chip-btn{padding:5px 9px;font-size:12px} .lv-name{font-size:22px} .panel{padding:20px 18px 18px} .keys{font-size:12px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div id="hud" class="hud" hidden>
  <div class="hud-tl">
    <div class="lv-name" id="lvName">第一夜<small>石径</small></div>
    <div class="pips" id="pips" aria-label="狐火"></div>
    <div class="lures" id="lures"></div>
  </div>
  <div class="hud-tr">
    <button class="chip-btn" id="bPause" type="button">暂停</button>
    <button class="chip-btn" id="bMute" type="button">声音 开</button>
    <button class="chip-btn" id="bQual" type="button">画质 高</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="status" id="status"></div>
  <div id="arrows"></div>
</div>
<div class="danger-edge" id="dangerEdge"></div>
<div class="title-card" id="titleCard"><div class="big" id="tcBig">第一夜</div><div class="sub" id="tcSub">石径</div></div>
<div class="caught" id="caught" hidden>被发现了</div>

<div class="touch" id="touch" hidden>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="tbtns">
    <button class="tbtn lure-b" id="tLure" type="button">诱饵</button>
    <button class="tbtn" id="tDash" type="button">疾奔</button>
  </div>
</div>

<div class="screen" id="scrStart">
  <div class="panel">
    <div class="logo"><h1>狐火</h1><span class="en">FOXFIRE</span></div>
    <p class="pitch">月夜，古寺庭园。你是一只灵狐，要悄悄取回散落各处的狐火——提灯巡夜的石哨灵正在园中走动。</p>
    <dl class="keys">
      <dt class="kb"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键</dt><dd class="kb">潜行移动，脚步无声</dd>
      <dt class="kb"><kbd>Shift</kbd></dt><dd class="kb">疾奔：更快，但会发出声响</dd>
      <dt class="kb"><kbd>E</kbd> / 点击地面</dt><dd class="kb">抛出狐火诱饵，把哨灵引开</dd>
      <dt class="kb"><kbd>Esc</kbd> <kbd>M</kbd> <kbd>Q</kbd></dt><dd class="kb">暂停 · 静音 · 画质</dd>
      <dt class="tc">摇杆</dt><dd class="tc">左下拖动，潜行移动，脚步无声</dd>
      <dt class="tc">疾奔</dt><dd class="tc">按住更快，但会发出声响</dd>
      <dt class="tc">诱饵</dt><dd class="tc">朝狐狸面前抛出狐火，把哨灵引开</dd>
    </dl>
    <div class="levels" id="levelBtns"></div>
    <div class="row"><button class="btn" id="bStart" type="button">入夜</button><span class="fine" id="bestLine"></span></div>
    <p class="fine">草丛里很难被发现，灯下则格外显眼。取完一夜的狐火，月门便会开启。</p>
  </div>
</div>

<div class="screen" id="scrPause" hidden>
  <div class="panel result">
    <h2>暂停</h2>
    <p class="pitch" id="pauseHint">夜还长。</p>
    <div class="row"><button class="btn" id="bResume" type="button">继续</button><button class="btn ghost" id="bRetry1" type="button">重来本夜</button><button class="btn ghost" id="bMenu1" type="button">回到标题</button></div>
  </div>
</div>

<div class="screen" id="scrDone" hidden>
  <div class="panel result">
    <h2 id="doneTitle">月门已开</h2>
    <div class="stars" id="doneStars"></div>
    <div class="stats">
      <div class="stat"><b id="dTime">0:00</b><span>用时</span></div>
      <div class="stat"><b id="dSpot">0</b><span>被发现</span></div>
      <div class="stat"><b id="dTries">1</b><span>尝试</span></div>
    </div>
    <p class="pitch" id="doneNote"></p>
    <div class="row"><button class="btn" id="bNext" type="button">下一夜</button><button class="btn ghost" id="bRetry2" type="button">重玩</button><button class="btn ghost" id="bMenu2" type="button">选关</button></div>
  </div>
</div>

  teleport: (x, z) => { fox.place(x, z, fox.h); camState.snap = true; },
  gate: () => level.gate && { x: level.gate.x, z: level.gate.z, inX: level.gate.inX, inZ: level.gate.inZ },
  sim: (sec, step = 1 / 30) => { for (let k = 0; k < sec / step; k++) { simT += step; update(step, simT); } return window.__game.debug(); },
  project: (x, z) => { const v = new THREE.Vector3(x, 0, z).project(camera); return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight }; },
  guardPos: i => ({ x: game.guards[i].x, z: game.guards[i].z, h: game.guards[i].h }),
};

// ---------- boot ----------
function start(data) {
  if (data && Number.isInteger(data.selected)) game.selected = clamp(data.selected, 0, save.unlocked - 1);
  else game.selected = clamp(save.unlocked - 1, 0, LEVELS.length - 1);
  applyQuality(); syncButtons();
  loadLevel(game.selected); game.mode = 'title'; poseTitleFox();
  showScreen('scrStart');
  renderer.setAnimationLoop(frame);
}
window.claude?.hot?.snapshot?.(() => ({ selected: game.selected }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
